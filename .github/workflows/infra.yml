name: infra

on:
  pull_request:
  push:
    branches: [main]

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: eu-central-1
  TOFU_VERSION: 1.13.1
  TF_VAR_budget_email: ${{ vars.BUDGET_EMAIL }}
  TF_VAR_jobs_image_tag: ${{ github.sha }}

jobs:
  plan:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: infra/prod
    env:
      # AWS steps are skipped before infra/bootstrap is applied, and for pull requests from forks.
      USE_AWS: ${{ vars.AWS_PLAN_ROLE_ARN != '' && github.event.pull_request.head.repo.full_name == github.repository }}
    steps:
      - uses: actions/checkout@v4
      - uses: opentofu/setup-opentofu@v2
        with:
          tofu_version: ${{ env.TOFU_VERSION }}
          tofu_wrapper: false
      - run: tofu fmt -check -recursive
      - run: tofu init -backend=false -input=false && tofu validate
      - if: env.USE_AWS == 'true'
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_PLAN_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - if: env.USE_AWS == 'true'
        run: tofu init -input=false -reconfigure -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}"
      # The plan role is read only, so it can't write the state lock.
      - if: env.USE_AWS == 'true'
        run: tofu plan -input=false -lock=false

  deploy:
    if: github.event_name == 'push' && vars.AWS_DEPLOY_ROLE_ARN != ''
    runs-on: ubuntu-24.04-arm
    concurrency:
      group: infra-deploy
      cancel-in-progress: false
    defaults:
      run:
        working-directory: infra/prod
    steps:
      - uses: actions/checkout@v4
      - uses: opentofu/setup-opentofu@v2
        with:
          tofu_version: ${{ env.TOFU_VERSION }}
          tofu_wrapper: false
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - run: tofu init -input=false -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}"
      # The image needs its repository before the Lambda can point at it.
      - run: tofu apply -input=false -auto-approve -target=aws_ecr_repository.jobs
      - id: ecr
        uses: aws-actions/amazon-ecr-login@v2
      - name: Build and push the jobs image
        run: |
          image="${{ steps.ecr.outputs.registry }}/deilbach-pegel-jobs:${GITHUB_SHA}"
          docker build --platform linux/arm64 --provenance=false --target jobs -t "$image" ../..
          docker push "$image"
      - run: tofu apply -input=false -auto-approve
