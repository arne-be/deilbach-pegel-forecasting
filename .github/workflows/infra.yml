name: infra

on:
  pull_request:
  push:
    branches: [main]

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: eu-central-1
  TOFU_VERSION: 1.13.1
  TF_VAR_budget_email: ${{ vars.BUDGET_EMAIL }}
  TF_VAR_jobs_image_tag: ${{ github.sha }}
  TF_VAR_grafana_url: ${{ vars.GRAFANA_URL }}

jobs:
  plan:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: infra/prod
    env:
      # AWS steps are skipped before infra/bootstrap is applied, and for pull requests from forks.
      USE_AWS: ${{ vars.AWS_PLAN_ROLE_ARN != '' && github.event.pull_request.head.repo.full_name == github.repository }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        with:
          tofu_version: ${{ env.TOFU_VERSION }}
          tofu_wrapper: false
      - run: tofu fmt -check -recursive
      - run: tofu init -backend=false -input=false && tofu validate
      - if: env.USE_AWS == 'true'
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_PLAN_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - if: env.USE_AWS == 'true'
        run: tofu init -input=false -reconfigure -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}"
      # The plan role is read only, so it can't write the state lock.
      - if: env.USE_AWS == 'true'
        run: tofu plan -input=false -lock=false

  deploy:
    if: github.event_name == 'push' && vars.AWS_DEPLOY_ROLE_ARN != ''
    runs-on: ubuntu-24.04-arm
    concurrency:
      group: infra-deploy
      cancel-in-progress: false
    defaults:
      run:
        working-directory: infra/prod
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        with:
          tofu_version: ${{ env.TOFU_VERSION }}
          tofu_wrapper: false
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - run: tofu init -input=false -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}"
      # The image needs its repository before the Lambda can point at it.
      - run: tofu apply -input=false -auto-approve -target=aws_ecr_repository.jobs
      - id: ecr
        uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2.1.7
      - name: Build and push the jobs image
        run: |
          image="${{ steps.ecr.outputs.registry }}/deilbach-pegel-jobs:${GITHUB_SHA}"
          docker build --platform linux/arm64 --provenance=false --target jobs -t "$image" ../..
          docker push "$image"
      # Before the Lambda moves to the new image, so new code never meets the old schema.
      - name: Migrate the prod database
        run: |
          DATABASE_URL="$(aws secretsmanager get-secret-value --secret-id deilbach-pegel/migrate-database-url --query SecretString --output text)"
          echo "::add-mask::$DATABASE_URL"
          export DATABASE_URL
          docker run --rm -v "$GITHUB_WORKSPACE/db:/db" -e DATABASE_URL ghcr.io/amacneil/dbmate:2.36.0@sha256:520c740c6e0ad73fde2cd1ea7e2b779aaf789d22aca8858f87a478e7094535fb --wait --no-dump-schema migrate
      - run: tofu apply -input=false -auto-approve
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 12.11.2
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.21.0
      - name: Build the website
        working-directory: web
        run: pnpm install --frozen-lockfile && pnpm build
      - name: Upload the website
        run: |
          bucket="$(tofu output -raw site_bucket)"
          distribution="$(tofu output -raw site_distribution_id)"
          aws s3 sync ../../web/dist "s3://$bucket" --delete
          aws cloudfront create-invalidation --distribution-id "$distribution" --paths "/*"
