name: python

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.11.7"
      - run: uv sync --locked --group analysis
      - name: Type check
        run: uv run mypy src tests
      - name: Tests
        run: uv run pytest
      - name: Lint
        run: uv run ruff check . && uv run ruff format --check .
      - name: Schema and records are up to date
        run: |
          scripts/refresh-schema.sh
          git diff --exit-code db/schema.sql src/pegel/adapters/storage/records.py
