name: python

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.7"
      - run: uv sync --locked
      - name: Type check
        run: uv run mypy src tests
      - name: Tests
        run: uv run pytest
      - name: Lint
        run: uv run ruff check . && uv run ruff format --check .
      - name: Schema and records are up to date
        run: |
          scripts/refresh-schema.sh
          git diff --exit-code db/schema.sql src/pegel/adapters/storage/records.py
