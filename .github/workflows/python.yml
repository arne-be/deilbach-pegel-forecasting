name: python

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          version: "0.11.7"
      - run: uv sync --locked --group analysis
      - name: Type check
        run: uv run mypy src tests
      - name: Tests
        run: uv run pytest
      - name: Lint
        run: uv run ruff check . && uv run ruff format --check .
      - name: Schema and records are up to date
        run: |
          scripts/refresh-schema.sh
          git diff --exit-code db/schema.sql src/pegel/adapters/storage/records.py
