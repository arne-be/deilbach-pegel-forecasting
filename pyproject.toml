[project]
name = "pegel"
version = "0.1.0"
description = "Hourly 48-hour water level forecast for the Deilbach gauge at Kupferdreh"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "boto3==1.43.111",
    "httpx==0.28.1",
    "psycopg[binary]==3.3.6",
    "pydantic==2.14.0",
]

[project.scripts]
pegel = "pegel.jobs.cli:main"

[dependency-groups]
dev = [
    "mypy==2.4.0",
    "pytest==9.1.1",
    "ruff==0.17.0",
    "testcontainers[postgres]==4.15.0",
]

[build-system]
requires = ["uv_build>=0.11.7,<0.12"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "N", "RUF", "DTZ"]

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"

[[tool.mypy.overrides]]
module = ["boto3"]
ignore_missing_imports = true
